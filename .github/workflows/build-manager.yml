name: Build Windows manager

on:
  workflow_dispatch:
  push:
    paths:
      - "manager/**"
      - ".github/workflows/build-manager.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r manager/requirements-build.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name IzurenVideoManager manager/app.py
      - run: Copy-Item manager/install-autostart.ps1 dist/install-autostart.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: IzurenVideoManager-Windows
          path: dist/*
